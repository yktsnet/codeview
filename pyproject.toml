[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codeview"
version = "0.1.0"
description = "Turn your local git repositories and their GitHub issues into a private, static code browser."
requires-python = ">=3.11"
dependencies = ["pygments", "markdown"]

[project.scripts]
codeview = "codeview.__main__:main"

[tool.setuptools]
packages = ["codeview"]

[tool.pytest.ini_options]
testpaths = ["tests"]
