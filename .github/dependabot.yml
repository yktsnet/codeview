version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    # build-system の下限は flake が使う nixpkgs の setuptools に合わせる。上げると nix build が通らない
    ignore:
      - dependency-name: "setuptools"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 7
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
